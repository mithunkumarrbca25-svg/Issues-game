name: Issues Game Controller

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  check-answer:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Process participant answer
        uses: actions/github-script@v7
        env:
          GAME1_ANSWER: ${{ secrets.GAME1_ANSWER }}
          GAME2_ANSWER: ${{ secrets.GAME2_ANSWER }}
          GAME3_ANSWER: ${{ secrets.GAME3_ANSWER }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const body = comment.body.trim();
            const author = comment.user.login;

            if (!body.toLowerCase().startsWith('/answer ')) return;

            const supplied = body.slice(8).trim().toLowerCase();

            const gameAnswers = {
              1: process.env.GAME1_ANSWER,
              2: process.env.GAME2_ANSWER,
              3: process.env.GAME3_ANSWER
            };

            if (!gameAnswers[issue.number]) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '⚠️ This issue is not configured as an answer-checking game issue.'
              });
              return;
            }

            const expected = gameAnswers[issue.number].trim().toLowerCase();

            if (supplied !== expected) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `❌ **Not quite, @${author}.** Try again. Use \`/answer YOUR_ANSWER\` when you are ready.`
              });
              return;
            }

            const nextIssue = issue.number + 1;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `✅ **Correct, @${author}!** Game ${issue.number} is complete.\n\n🔓 **Game ${nextIssue} is now unlocked for you.**\n\nContinue here: https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${nextIssue}`
            });

            // Record a simple completion marker in the issue title without
            // exposing the correct answer.
            if (issue.number < 3) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: nextIssue,
                body: `🔐 **Progress check:** @${author} has unlocked this stage by completing Game ${issue.number}.\n\nStart your submission with \`/answer YOUR_ANSWER\`.`
              });
            }
