name: Puzzle Answer Checker

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-answer:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check submission file
        run: |
          if [ ! -f submission.txt ]; then
            echo "❌ submission.txt not found!"
            exit 1
          fi

      - name: Read answer
        id: answer
        run: |
          ANSWER=$(cat submission.txt | tr '[:upper:]' '[:lower:]' | xargs)
          echo "answer=$ANSWER" >> "$GITHUB_OUTPUT"

      - name: Determine level
        id: level
        run: |
          TITLE="${{ github.event.pull_request.title }}"

          if echo "$TITLE" | grep -qi "level 1"; then
            echo "level=1" >> "$GITHUB_OUTPUT"
          elif echo "$TITLE" | grep -qi "level 2"; then
            echo "level=2" >> "$GITHUB_OUTPUT"
          elif echo "$TITLE" | grep -qi "level 3"; then
            echo "level=3" >> "$GITHUB_OUTPUT"
          else
            echo "❌ PR title must contain Level 1, Level 2 or Level 3"
            echo "level=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Level 1
        if: steps.level.outputs.level == '1'
        run: |
          if [ "${{ steps.answer.outputs.answer }}" != "$(echo '${{ secrets.LEVEL1_ANSWER }}' | tr '[:upper:]' '[:lower:]')" ]; then
            echo "❌ Incorrect answer!"
            exit 1
          fi
          echo "✅ Level 1 correct!"

      - name: Check Level 2
        if: steps.level.outputs.level == '2'
        run: |
          if [ "${{ steps.answer.outputs.answer }}" != "$(echo '${{ secrets.LEVEL2_ANSWER }}' | tr '[:upper:]' '[:lower:]')" ]; then
            echo "❌ Incorrect answer!"
            exit 2
          fi
          echo "✅ Level 2 correct!"

      - name: Check Level 3
        if: steps.level.outputs.level == '3'
        run: |
          if [ "${{ steps.answer.outputs.answer }}" != "$(echo '${{ secrets.LEVEL3_ANSWER }}' | tr '[:upper:]' '[:lower:]')" ]; then
            echo "❌ Incorrect answer!"
            exit 3
          fi
          echo "✅ Level 3 correct!"

      - name: Auto merge
        if: success()
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
